[package]
name = "results_watcher"
version = "1.0.0"
edition = "2021"
description = "Invisible Roblox RESULTS panel watcher (external capture only, no injection)"
publish = false

[lib]
name = "results_watcher"
path = "src/lib.rs"

[[bin]]
name = "ResultsWatcher"
path = "src/main.rs"

[dependencies]
# PNG encode (and decode for the reference-image tests / --debug-image). Tiny, pure Rust.
png = "0.17"

[target.'cfg(windows)'.dependencies.windows]
version = "=0.58.0"
features = [
    "Foundation",
    "Graphics",
    "Graphics_Capture",
    "Graphics_DirectX",
    "Graphics_DirectX_Direct3D11",
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_System_WinRT",
    "Win32_System_WinRT_Direct3D11",
    "Win32_System_WinRT_Graphics_Capture",
    "Win32_UI_Accessibility",
    "Win32_UI_HiDpi",
    "Win32_UI_Input",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
]

[profile.release]
opt-level = "s"        # small + fast enough; the hot path is a few dozen pixels
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"